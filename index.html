<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIT — Auto Spatial Fashion & Personal Try-On</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #cfd5df;
      color: #1a1d24;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      perspective: 1200px;
      user-select: none;
    }

    .studio-room {
      position: fixed;
      inset: -40px;
      background: radial-gradient(circle at 50% 45%, #eef1f6 0%, #c8cfd9 58%, #9ea7b5 100%);
      z-index: -2;
      transition: transform 0.16s ease-out;
    }

    .studio-floor {
      position: fixed;
      bottom: 0;
      left: -10%;
      width: 120%;
      height: 30vh;
      background: linear-gradient(to bottom, rgba(176, 184, 196, 0.25), rgba(132, 141, 156, 0.72));
      border-top: 1px solid rgba(255, 255, 255, 0.45);
      z-index: -1;
    }

    .bg-title {
      position: fixed;
      top: 43%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(140px, 23vw, 310px);
      font-weight: 900;
      letter-spacing: -0.04em;
      color: rgba(255, 255, 255, 0.52);
      pointer-events: none;
      z-index: 0;
      transition: transform 0.2s ease-out;
    }

    header {
      display: flex;
      justify-content: center;
      padding-top: 18px;
      z-index: 20;
    }

    .nav-pill {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      background: rgba(255, 255, 255, 0.62);
      backdrop-filter: blur(14px);
      padding: 6px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.78);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .nav-btn {
      border: none;
      background: transparent;
      padding: 7px 15px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: #3f4654;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn.active {
      background: #1a1d24;
      color: #fff;
    }

    .stage {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      padding: 12px 24px;
    }

    .tab-panel {
      display: none;
      width: 100%;
      height: 100%;
      justify-content: center;
      align-items: center;
    }

    .tab-panel.active {
      display: flex;
    }

    /* Row of Left Cards, Center Person, Right Cards */
    .showcase-row {
      width: 100%;
      max-width: 1340px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .side-cards {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .glass-item-card {
      width: 138px;
      height: 176px;
      background: rgba(255, 255, 255, 0.44);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 18px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(20, 26, 40, 0.08);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.25s ease, background 0.25s ease;
    }

    .glass-item-card.outer {
      transform: scale(0.85);
      opacity: 0.78;
    }

    .glass-item-card:hover {
      transform: translateY(-6px) scale(1.03);
      background: rgba(255, 255, 255, 0.7);
    }

    .glass-item-card.active {
      border: 2px solid #5b2be0;
      background: rgba(255, 255, 255, 0.82);
      transform: translateY(-5px) scale(1.05);
    }

    .card-pic {
      width: 96px;
      height: 76px;
      object-fit: cover;
      border-radius: 10px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      color: #1a1d24;
    }

    .card-sub {
      font-size: 11px;
      color: #5b6375;
      margin-top: 2px;
    }

    /* Center Person Photo Stage */
    .center-person-stage {
      position: relative;
      width: 255px;
      height: 450px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .person-frame {
      position: relative;
      width: 230px;
      height: 426px;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.38);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 18px 36px rgba(15, 23, 42, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
    }

    .person-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      transition: transform 0.35s ease;
    }

    .empty-photo-box {
      text-align: center;
      padding: 16px;
    }

    /* Clean Auto-Fitted Zone Highlight (No text badges over face/body) */
    .auto-zone-overlay {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 18px;
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
    }

    .auto-zone-overlay.visible {
      opacity: 1;
    }

    .auto-zone-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.42;
      mix-blend-mode: multiply;
    }

    /* Secondary Panels */
    .panel-card {
      width: 100%;
      max-width: 920px;
      max-height: 74vh;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(16px);
      border-radius: 22px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.1);
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .box {
      background: rgba(255, 255, 255, 0.94);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(0, 0, 0, 0.06);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 11px;
    }

    .field label {
      font-size: 12px;
      font-weight: 600;
      color: #334155;
    }

    .field input, .field select {
      padding: 8px 10px;
      border-radius: 9px;
      border: 1px solid #cbd5e1;
      font-size: 13px;
      user-select: text;
    }

    .btn {
      border: none;
      background: #1a1d24;
      color: #fff;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn.light {
      background: rgba(26, 29, 36, 0.1);
      color: #1a1d24;
    }

    .btn.danger {
      background: #ef4444;
      color: #fff;
    }

    /* Bottom Dock */
    footer {
      display: flex;
      justify-content: center;
      padding-bottom: 18px;
      z-index: 20;
    }

    .dock {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(14px);
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.82);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.08);
    }

    .dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease;
    }

    .dot:hover {
      transform: scale(1.18);
    }

    .divider {
      width: 1px;
      height: 16px;
      background: rgba(0, 0, 0, 0.14);
    }

    /* Cart Drawer */
    .cart-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.36);
      display: none;
      justify-content: flex-end;
      z-index: 50;
    }

    .cart-backdrop.open { display: flex; }

    .cart-drawer {
      width: 100%;
      max-width: 370px;
      height: 100%;
      background: #f8fafc;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    @media (max-width: 960px) {
      body { height: auto; overflow: auto; }
      .showcase-row { flex-direction: column; }
      .side-cards { flex-wrap: wrap; justify-content: center; }
      .glass-item-card.outer { display: none; }
    }
  </style>
</head>
<body>

  <div class="studio-room" id="studioRoom"></div>
  <div class="studio-floor"></div>
  <div class="bg-title" id="bgTitle">FIT</div>

  <header>
    <div class="nav-pill">
      <button class="nav-btn active" id="tab-stage" onclick="switchTab('stage')">Try-On</button>
      <button class="nav-btn" id="tab-catalog" onclick="switchTab('catalog')">Products</button>
      <button class="nav-btn" id="tab-manage" onclick="switchTab('manage')">+ My Pic & Items</button>
      <button class="nav-btn" id="cartBtn" onclick="toggleCart(true)">Cart (1)</button>
    </div>
  </header>

  <main class="stage">
    <!-- Main Spatial Stage -->
    <section class="tab-panel active" id="panel-stage">
      <div class="showcase-row">
        <div class="side-cards" id="leftSide"></div>

        <div class="center-person-stage" id="centerStage">
          <div class="person-frame" id="personFrame">
            <img id="personImg" class="person-img" alt="User Photo" style="display:none;" />
            <div class="empty-photo-box" id="emptyPhotoBox">
              <div style="font-weight:800; font-size:13px; margin-bottom:6px;">Upload Your Photo</div>
              <label class="btn" style="cursor:pointer; display:inline-block;">
                Choose Photo
                <input type="file" accept="image/*" style="display:none;" onchange="uploadPhoto(event)" />
              </label>
            </div>

            <!-- Automatic Zone-Fitted Layer -->
            <div class="auto-zone-overlay" id="autoZoneLayer">
              <img id="autoZoneImg" class="auto-zone-img" alt="" style="display:none;" />
            </div>
          </div>
        </div>

        <div class="side-cards" id="rightSide"></div>
      </div>
    </section>

    <!-- Products Grid -->
    <section class="tab-panel" id="panel-catalog">
      <div class="panel-card">
        <h2 style="font-size:18px; margin-bottom:14px;">All Items</h2>
        <div class="grid-3" id="catalogGrid"></div>
      </div>
    </section>

    <!-- Manage My Pic & Items -->
    <section class="tab-panel" id="panel-manage">
      <div class="panel-card">
        <h2 style="font-size:18px; margin-bottom:14px;">Manage My Photo & Items</h2>
        <div class="grid-3">
          <div class="box">
            <h3 style="font-size:14px; margin-bottom:10px;">1. My Photo</h3>
            <div class="field">
              <label>Upload Standing Photo</label>
              <input type="file" accept="image/*" onchange="uploadPhoto(event)" />
            </div>
            <button class="btn light" onclick="resetAutoState()">Auto Reset</button>
          </div>

          <div class="box">
            <h3 style="font-size:14px; margin-bottom:10px;">2. Add Item</h3>
            <div class="field">
              <label>Name</label>
              <input type="text" id="itemName" placeholder="e.g. Crimson Court 4" />
            </div>
            <div class="field">
              <label>Price ($)</label>
              <input type="number" id="itemPrice" placeholder="e.g. 210" />
            </div>
            <div class="field">
              <label>Category</label>
              <select id="itemCategory">
                <option value="shoe">Sneaker</option>
                <option value="bag">Bag</option>
              </select>
            </div>
            <div class="field">
              <label>Accent Color</label>
              <input type="color" id="itemColor" value="#dc2626" style="height:34px;" />
            </div>
            <div class="field">
              <label>Item Photo</label>
              <input type="file" id="itemPhoto" accept="image/*" />
            </div>
            <button class="btn" style="width:100%;" onclick="addItem()">Save Item</button>
          </div>

          <div class="box">
            <h3 style="font-size:14px; margin-bottom:10px;">3. Saved Items</h3>
            <div id="manageItemsList" style="display:flex; flex-direction:column; gap:8px; max-height:240px; overflow-y:auto;"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="dock">
      <button class="btn" id="switchCategoryBtn" onclick="toggleCategoryAuto()">Bags ↔ Sneakers</button>
      <div class="divider"></div>
      <span style="font-size:12px; font-weight:600; color:#3f4654;">Style</span>
      <div class="dots">
        <button class="dot" style="background:#6326d9;" onclick="autoApplyStyle('#6326d9', 'top')" title="Violet Top"></button>
        <button class="dot" style="background:#dc2626;" onclick="autoApplyStyle('#dc2626', 'shoe')" title="Crimson Fit"></button>
        <button class="dot" style="background:#0284c7;" onclick="autoApplyStyle('#0284c7', 'bag')" title="Cobalt Carry"></button>
        <button class="dot" style="background:#e2e8f0;" onclick="resetAutoState()" title="Clean"></button>
      </div>
      <div class="divider"></div>
      <span style="font-size:12px; font-weight:700;" id="selectedLabel">Crimson Court 4 — $210</span>
      <button class="btn" onclick="addSelectedToCart()">+ Cart</button>
    </div>
  </footer>

  <div class="cart-backdrop" id="cartBackdrop" onclick="if(event.target.id==='cartBackdrop') toggleCart(false)">
    <aside class="cart-drawer">
      <div>
        <div style="display:flex; justify-content:space-between; align-items:center; padding-bottom:12px; border-bottom:1px solid #e2e8f0;">
          <h3>Cart</h3>
          <button class="btn light" onclick="toggleCart(false)">×</button>
        </div>
        <div id="cartList" style="display:flex; flex-direction:column; gap:10px; margin-top:14px;"></div>
      </div>
      <div style="border-top:1px solid #e2e8f0; padding-top:12px;">
        <div style="display:flex; justify-content:space-between; font-weight:800; margin-bottom:10px;">
          <span>Total</span>
          <span id="cartTotal">$210</span>
        </div>
        <button class="btn" style="width:100%; padding:10px;" onclick="checkout()">Checkout</button>
      </div>
    </aside>
  </div>

  <script>
    const initialItems = [
      { id: 1, name: 'Aero Slate V1', price: 165, category: 'shoe', color: '#64748b', image: '' },
      { id: 2, name: 'Crimson Court 4', price: 210, category: 'shoe', color: '#dc2626', image: '' },
      { id: 3, name: 'Neon Pulse Low', price: 190, category: 'shoe', color: '#10b981', image: '' },
      { id: 4, name: 'Solaris Runner', price: 180, category: 'shoe', color: '#f59e0b', image: '' },
      { id: 5, name: 'Crimson Carry', price: 240, category: 'bag', color: '#dc2626', image: '' },
      { id: 6, name: 'Cobalt Cabin', price: 220, category: 'bag', color: '#0284c7', image: '' },
      { id: 7, name: 'Slate Duffel', price: 195, category: 'bag', color: '#475569', image: '' },
      { id: 8, name: 'Violet Tote', price: 175, category: 'bag', color: '#6326d9', image: '' }
    ];

    let items = JSON.parse(localStorage.getItem('fit_auto_items')) || initialItems;
    let myPhoto = localStorage.getItem('fit_auto_photo') || '';
    let activeCategory = 'bag';
    let selectedItem = items[4] || items[0];
    let activeColor = '';
    let activeZone = 'none'; // 'top', 'shoe', 'bag', 'none'
    let activeOverlayImg = '';

    let cart = [{ name: selectedItem.name, price: selectedItem.price, qty: 1 }];

    const studioRoom = document.getElementById('studioRoom');
    const bgTitle = document.getElementById('bgTitle');
    const centerStage = document.getElementById('centerStage');

    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 2;
      const y = (e.clientY / window.innerHeight - 0.5) * 2;
      studioRoom.style.transform = `translate(${x * -12}px, ${y * -8}px)`;
      bgTitle.style.transform = `translate(calc(-50% + ${x * -20}px), calc(-50% + ${y * -14}px))`;
      centerStage.style.transform = `translate(${x * 8}px, ${y * 4}px)`;
    });

    function save() {
      localStorage.setItem('fit_auto_items', JSON.stringify(items));
      if (myPhoto) localStorage.setItem('fit_auto_photo', myPhoto);
    }

    function switchTab(tab) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
      document.getElementById(`panel-${tab}`).classList.add('active');
    }

    function uploadPhoto(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        myPhoto = ev.target.result;
        save();
        render();
        switchTab('stage');
      };
      reader.readAsDataURL(file);
    }

    function svgGraphic(item) {
      if (item.category === 'bag') {
        return `
          <svg width="92" height="72" viewBox="0 0 120 80">
            <path d="M44 22 Q44 12 60 12 Q76 12 76 22" fill="none" stroke="#1e293b" stroke-width="4"/>
            <rect x="26" y="22" width="68" height="46" rx="12" fill="${item.color}" stroke="#1e293b" stroke-width="2"/>
          </svg>
        `;
      }
      return `
        <svg width="96" height="72" viewBox="0 0 120 80">
          <path d="M15 55 Q20 32 45 32 L68 18 L84 38 Q105 40 110 56 L108 64 L12 64 Z" fill="#f1f5f9" stroke="#1e293b" stroke-width="2"/>
          <path d="M42 35 L72 24 L82 42 L48 48 Z" fill="${item.color}"/>
          <path d="M12 60 L108 60 L106 67 L14 67 Z" fill="#1e293b"/>
        </svg>
      `;
    }

    function applyAutoZonePosition() {
      const zoneEl = document.getElementById('autoZoneLayer');
      const zoneImg = document.getElementById('autoZoneImg');
      const personImg = document.getElementById('personImg');

      if (!myPhoto || activeZone === 'none' || !activeColor) {
        zoneEl.classList.remove('visible');
        zoneImg.style.display = 'none';
        personImg.style.transform = 'scale(1) translateY(0)';
        return;
      }

      zoneEl.classList.add('visible');
      zoneEl.style.backgroundColor = `${activeColor}44`;

      if (activeZone === 'shoe') {
        zoneEl.style.top = 'auto';
        zoneEl.style.bottom = '4%';
        zoneEl.style.width = '72%';
        zoneEl.style.height = '18%';
        personImg.style.transform = 'scale(1.04) translateY(-4%)';
      } else if (activeZone === 'bag') {
        zoneEl.style.top = 'auto';
        zoneEl.style.bottom = '22%';
        zoneEl.style.width = '46%';
        zoneEl.style.height = '24%';
        personImg.style.transform = 'scale(1.02) translateY(0)';
      } else {
        zoneEl.style.bottom = 'auto';
        zoneEl.style.top = '25%';
        zoneEl.style.width = '76%';
        zoneEl.style.height = '36%';
        personImg.style.transform = 'scale(1.03) translateY(2%)';
      }

      if (activeOverlayImg) {
        zoneImg.src = activeOverlayImg;
        zoneImg.style.display = 'block';
      } else {
        zoneImg.style.display = 'none';
      }
    }

    function render() {
      const imgEl = document.getElementById('personImg');
      const emptyBox = document.getElementById('emptyPhotoBox');
      if (myPhoto) {
        imgEl.src = myPhoto;
        imgEl.style.display = 'block';
        emptyBox.style.display = 'none';
      } else {
        imgEl.style.display = 'none';
        emptyBox.style.display = 'block';
      }

      const filtered = items.filter(i => i.category === activeCategory);
      const list = filtered.length >= 2 ? filtered : items;
      const mid = Math.ceil(list.length / 2);

      const drawCard = (item, idx, arr) => {
        const isOuter = idx === 0 || idx === arr.length - 1;
        const isActive = selectedItem && selectedItem.id === item.id;
        const media = item.image
          ? `<img src="${item.image}" class="card-pic" alt="${item.name}" />`
          : svgGraphic(item);
        return `
          <div class="glass-item-card ${isOuter ? 'outer' : ''} ${isActive ? 'active' : ''}" onclick="autoSelectItem(${item.id})">
            ${media}
            <div>
              <div class="card-title">${item.name}</div>
              <div class="card-sub">$${item.price}</div>
            </div>
          </div>
        `;
      };

      const leftArr = list.slice(0, mid);
      const rightArr = list.slice(mid);
      document.getElementById('leftSide').innerHTML = leftArr.map((it, i) => drawCard(it, i, leftArr)).join('');
      document.getElementById('rightSide').innerHTML = rightArr.map((it, i) => drawCard(it, i, rightArr)).join('');

      document.getElementById('catalogGrid').innerHTML = items.map(it => `
        <div class="box">
          ${it.image ? `<img src="${it.image}" style="width:100%; height:130px; object-fit:cover; border-radius:10px; margin-bottom:10px;" />` : ''}
          <div style="font-weight:700; font-size:14px;">${it.name}</div>
          <div style="font-size:12px; color:#64748b; margin:4px 0 10px;">$${it.price}</div>
          <div style="display:flex; gap:8px;">
            <button class="btn" onclick="autoSelectItem(${it.id}); switchTab('stage');">Auto Fit</button>
            <button class="btn light" onclick="addToCart(${it.id})">+ Cart</button>
          </div>
        </div>
      `).join('');

      document.getElementById('manageItemsList').innerHTML = items.map(it => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:7px 10px; border:1px solid #e2e8f0; border-radius:8px;">
          <span style="font-size:12px; font-weight:700;">${it.name} ($${it.price})</span>
          <button class="btn danger" onclick="deleteItem(${it.id})">×</button>
        </div>
      `).join('');

      if (selectedItem) {
        document.getElementById('selectedLabel').textContent = `${selectedItem.name} — $${selectedItem.price}`;
      }

      applyAutoZonePosition();
      renderCart();
    }

    function toggleCategoryAuto() {
      activeCategory = activeCategory === 'bag' ? 'shoe' : 'bag';
      const first = items.find(i => i.category === activeCategory);
      if (first) {
        autoSelectItem(first.id);
      } else {
        render();
      }
    }

    function autoSelectItem(id) {
      const found = items.find(i => i.id === id);
      if (!found) return;
      selectedItem = found;
      activeCategory = found.category;
      activeColor = found.color;
      activeZone = found.category === 'shoe' ? 'shoe' : 'bag';
      activeOverlayImg = found.image || '';
      render();
    }

    function autoApplyStyle(hex, zone) {
      activeColor = hex;
      activeZone = zone;
      activeOverlayImg = '';
      render();
    }

    function resetAutoState() {
      activeColor = '';
      activeZone = 'none';
      activeOverlayImg = '';
      render();
    }

    function addItem() {
      const name = document.getElementById('itemName').value.trim();
      const price = Number(document.getElementById('itemPrice').value);
      const category = document.getElementById('itemCategory').value;
      const color = document.getElementById('itemColor').value;
      const file = document.getElementById('itemPhoto').files && document.getElementById('itemPhoto').files[0];

      if (!name || !price) return alert('Enter name and price.');

      const finish = (imgData) => {
        const created = { id: Date.now(), name, price, category, color, image: imgData || '' };
        items.push(created);
        save();
        autoSelectItem(created.id);
        document.getElementById('itemName').value = '';
        document.getElementById('itemPrice').value = '';
        document.getElementById('itemPhoto').value = '';
        switchTab('stage');
      };

      if (file) {
        const reader = new FileReader();
        reader.onload = ev => finish(ev.target.result);
        reader.readAsDataURL(file);
      } else {
        finish('');
      }
    }

    function deleteItem(id) {
      if (items.length <= 1) return;
      items = items.filter(i => i.id !== id);
      if (selectedItem.id === id) selectedItem = items[0];
      save();
      render();
    }

    function toggleCart(open) {
      document.getElementById('cartBackdrop').classList.toggle('open', open);
    }

    function addSelectedToCart() {
      if (selectedItem) addToCart(selectedItem.id);
    }

    function addToCart(id) {
      const it = items.find(i => i.id === id);
      if (!it) return;
      const existing = cart.find(c => c.name === it.name);
      if (existing) existing.qty += 1;
      else cart.push({ name: it.name, price: it.price, qty: 1 });
      renderCart();
      toggleCart(true);
    }

    function changeQty(idx, delta) {
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      renderCart();
    }

    function renderCart() {
      const count = cart.reduce((s, i) => s + i.qty, 0);
      const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
      document.getElementById('cartBtn').textContent = `Cart (${count})`;
      document.getElementById('cartTotal').textContent = `$${total}`;
      document.getElementById('cartList').innerHTML = cart.length === 0
        ? `<p style="color:#64748b; font-size:13px;">Cart is empty.</p>`
        : cart.map((c, idx) => `
          <div style="display:flex; justify-content:space-between; align-items:center; background:#fff; padding:10px; border-radius:10px; border:1px solid #e2e8f0;">
            <div>
              <div style="font-size:13px; font-weight:700;">${c.name}</div>
              <div style="font-size:11px; color:#64748b;">$${c.price}</div>
            </div>
            <div style="display:flex; align-items:center; gap:6px;">
              <button class="btn light" onclick="changeQty(${idx}, -1)">-</button>
              <span style="font-size:12px; font-weight:700;">${c.qty}</span>
              <button class="btn light" onclick="changeQty(${idx}, 1)">+</button>
            </div>
          </div>
        `).join('');
    }

    function checkout() {
      if (!cart.length) return alert('Cart is empty.');
      const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
      alert(`Total: $${total}`);
    }

    render();
  </script>
</body>
</html>
