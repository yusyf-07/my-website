<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FIT — Virtual Fashion Store</title>
<style>
:root{--bg1:#e9ebf3;--bg2:#b9bdd0;--ink:#1d1f2b;--glass:rgba(255,255,255,.45);--line:rgba(255,255,255,.7);--big:rgba(255,255,255,.55);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a2d3c;--bg2:#12131b;--ink:#f2f3f8;--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.18);--big:rgba(255,255,255,.07)}}
:root[data-theme="dark"]{--bg1:#2a2d3c;--bg2:#12131b;--ink:#f2f3f8;--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.18);--big:rgba(255,255,255,.07)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 30%,var(--bg1),var(--bg2));color:var(--ink);font-family:Inter,system-ui,-apple-system,"Noto Sans Bengali",sans-serif;overflow:hidden}
.stage{position:relative;height:100%;overflow:hidden;perspective:1200px}
.big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(46vw,420px);font-weight:900;letter-spacing:.05em;color:var(--big);user-select:none;transition:transform .2s}
nav{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:99px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);z-index:5;max-width:94vw;overflow-x:auto}
nav button{border:0;background:none;color:inherit;font:inherit;font-size:12px;padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ink);color:var(--bg1)}
.model{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);height:min(68vh,560px);z-index:3;transition:transform .2s}
.track{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:22px;z-index:2;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .4s}
.track.out{opacity:0;transform:translateX(-80px)}
.side{display:flex;gap:18px;align-items:center}
.card{width:clamp(88px,14vw,150px);aspect-ratio:3/4.4;border-radius:18px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .3s,box-shadow .3s;transform:rotateY(var(--r,0deg))}
.side.l .card{--r:18deg}.side.r .card{--r:-18deg}
.card:hover,.card.sel{transform:rotateY(0) scale(1.08);box-shadow:0 20px 40px rgba(0,0,0,.18)}
.card svg{width:70%;height:auto}
.card small{font-size:11px;opacity:.75;text-align:center;padding:0 6px}
.gap{width:clamp(120px,22vw,230px)}
.info{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);z-index:5;text-align:center;font-size:13px;padding:10px 18px;border-radius:99px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px)}
@media(max-width:600px){.gap{width:70px}.side{gap:10px}.track{gap:10px}.side.far{display:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="big" id="big">FIT</div>
  <nav id="nav"></nav>
  <div class="track" id="track"></div>
  <svg class="model" id="model" viewBox="0 0 200 520" aria-label="Model">
    <circle cx="100" cy="42" r="26" fill="#e8c4a8"/>
    <path d="M74 36q26-34 52 0q-6-14-26-14t-26 14z" fill="#1b1b22"/>
    <rect x="90" y="64" width="20" height="18" fill="#e8c4a8"/>
    <path id="jacket" d="M52 92q48-22 96 0l16 150-28 6-4-84-8 86h-72l-8-86-4 84-28-6z" fill="#6a3fd0"/>
    <path d="M100 86v156" stroke="#00000033" stroke-width="2"/>
    <path id="pants" d="M64 250h72l8 230h-30l-14-170-14 170h-30z" fill="#16161d"/>
    <ellipse id="shoeL" cx="78" cy="492" rx="26" ry="12" fill="#f4f4f4" stroke="#999"/>
    <ellipse id="shoeR" cx="124" cy="492" rx="26" ry="12" fill="#f4f4f4" stroke="#999"/>
  </svg>
  <div class="info" id="info">পোশাক বা জুতার কার্ডে ক্লিক করুন — মডেলকে পরিয়ে দেখুন</div>
</div>
<script>
const shoe=c=>`<svg viewBox="0 0 100 60"><path d="M6 40q4-22 30-22l12 10q24 2 44 8v14H6z" fill="${c}"/><rect x="6" y="48" width="88" height="8" rx="4" fill="#fff" stroke="#bbb"/></svg>`;
const coat=c=>`<svg viewBox="0 0 100 100"><path d="M26 20q24-14 48 0l16 36-10 4-4-14v44H24V46l-4 14-10-4z" fill="${c}"/></svg>`;
const pant=c=>`<svg viewBox="0 0 100 100"><path d="M28 8h44l6 88H56L50 40l-6 56H22z" fill="${c}"/></svg>`;
const DATA={
 Outerwear:{icon:coat,t:'jacket',items:[['Puffer Purple','#6a3fd0'],['Forest Parka','#2f6b4f'],['Sunset Orange','#e5622d'],['Ice Blue','#6fa6d8'],['Charcoal','#3a3d48']]},
 Bottoms:{icon:pant,t:'pants',items:[['Black Slim','#16161d'],['Denim','#35507a'],['Khaki','#b79d6b'],['Olive Cargo','#5b6240'],['Grey','#6b6f7b']]},
 Shoes:{icon:shoe,t:'shoes',items:[['Runner Black','#1b1b22'],['Retro Red','#d11f2c'],['Court White','#ececec'],['Trail Green','#3f7a4f'],['Royal Blue','#2b4fd0']]}
};
const $=id=>document.getElementById(id);
const nav=$('nav'),track=$('track');
let cur='Outerwear';
Object.keys(DATA).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>show(k);b.dataset.k=k;nav.appendChild(b)});
function apply(type,c,name){
 if(type==='jacket')$('jacket').setAttribute('fill',c);
 if(type==='pants')$('pants').setAttribute('fill',c);
 if(type==='shoes'){$('shoeL').setAttribute('fill',c);$('shoeR').setAttribute('fill',c)}
 $('info').textContent=name+' — পরানো হয়েছে ✓';
}
function show(k){
 cur=k;
 [...nav.children].forEach(b=>b.classList.toggle('on',b.dataset.k===k));
 track.classList.add('out');
 setTimeout(()=>{
  const d=DATA[k];
  const mk=(arr,cls)=>`<div class="side ${cls}">`+arr.map(([n,c])=>`<div class="card" data-n="${n}" data-c="${c}">${d.icon(c)}<small>${n}</small></div>`).join('')+'</div>';
  track.innerHTML=mk(d.items.slice(0,2),'l')+'<div class="gap"></div>'+mk(d.items.slice(2),'r');
  track.querySelectorAll('.card').forEach(el=>el.onclick=()=>{track.querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');apply(d.t,el.dataset.c,el.dataset.n)});
  track.style.transform='translateX(80px)';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{track.classList.remove('out');track.style.transform=''}));
 },350);
}
$('stage').addEventListener('pointermove',e=>{
 const x=(e.clientX/innerWidth-.5),y=(e.clientY/innerHeight-.5);
 $('big').style.transform=`translate(${x*-30}px,${y*-20}px)`;
 $('model').style.transform=`translateX(calc(-50% + ${x*14}px))`;
 track.style.perspectiveOrigin=`${50+x*20}% 50%`;
});
show('Outerwear');
</script>
</body>
</html>
